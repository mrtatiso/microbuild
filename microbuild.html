          let hw = t.offsetWidth / 2;
          let up = thh, down = thh;
          if (t._thumb) { up += THUMB_GAP + THUMB_HALF * 2; hw = Math.max(hw, THUMB_HALF); }
          const tn = noteOf(t);
          if (tn) { down += NOTE_GAP + tn.offsetHeight; hw = Math.max(hw, tn.offsetWidth / 2); }
          return { hw, hh: (up + down) / 2, dy: (down - up) / 2 };
        });

        const needed = sizes.reduce((s, z) => s + z.hw * 2 + 14, 0);
        const perimeter = 4 * (bhw + bhh) + Math.PI * 2 * ORBIT_GAP;
        const extra = Math.max(0, (needed - perimeter) / (Math.PI * 2));
        tags.forEach((t, i) => {
          if (drag && drag.item === t) return;
          const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
          const cos = Math.cos(a), sin = Math.sin(a);
          const ex = bhw * Math.pow(Math.abs(cos), 0.5);
          const ey = bhh * Math.pow(Math.abs(sin), 0.5);
          const base = Math.hypot(ex, ey);
          const d = base + ORBIT_GAP + extra + Math.abs(cos) * sizes[i].hw + Math.abs(sin) * sizes[i].hh;
          t._tx = cx + cos * d;
          t._ty = cy + sin * d - sizes[i].dy;
        });
        kick();
      }

      function attach(tag, f) {
        if (tag._folder === f) { layoutFolder(f); return; }
        const prev = tag._folder;
        if (prev) {
          prev._tags = prev._tags.filter((t) => t !== tag);
          if (tag._line) tag._line.remove();
        }
        tag._folder = f;
        f._tags.push(tag);
        tag.style.setProperty('--c', f._color);
        if (tag._thumb) tag._thumb.style.setProperty('--c', f._color);
        const line = document.createElementNS(SVG_NS, 'line');
        line.style.setProperty('--c', f._color);
        links.appendChild(line);
        tag._line = line;
        if (prev) layoutFolder(prev);
        layoutFolder(f);
      }

      function folderAt(wx, wy) {
        let hit = null;
        for (const f of folders()) {
          if (Math.abs(wx - f._x) <= f._hw + 10 && Math.abs(wy - f._y) <= f._hh + 10) hit = f;
        }
        return hit;
      }

      function setDropTarget(f) {
        if (dropTarget === f) return;
        if (dropTarget) dropTarget.classList.remove('drop-target');
        dropTarget = f;
        if (f) f.classList.add('drop-target');
      }

      // =====================================================================
      // {scene}
      // =====================================================================
      function makeScene(f, wx, wy) {
        const s = document.createElement('div');
        s.className = 'scene';
        s._id = newId();
        s._folder = f;
        s._w = MAX_W;
        s._h = MAX_H;
        s._cells = Array.from({ length: MAX_H }, () => Array(MAX_W).fill(null));
        s._note = null;
        s._hidden = false;
        s._piece = null;

        const head = document.createElement('div');
        head.className = 'scene-head';
        const b1 = document.createElement('span');
        b1.className = 'brace';
        b1.textContent = '{';
        const b2 = b1.cloneNode();
        b2.textContent = '}';
        s._label = document.createElement('span');
        s._label.className = 'scene-label';
        head.append(b1, s._label, b2);

        s._cv = document.createElement('canvas');
        s._cv.className = 'scene-preview';
        s.append(head, s._cv);

        const line = document.createElementNS(SVG_NS, 'line');
        line.classList.add('scene-line');
        links.appendChild(line);
        s._line = line;

        f._scenes.push(s);
        s.style.setProperty('--c', f._color);
        line.style.setProperty('--c', f._color);
        world.appendChild(s);
        setPos(s, wx, wy);
        renderScenePreview(s);
        return s;
      }

      function sceneSpot(f) {
        let r = f._hw + 40;
        for (const t of f._tags) r = Math.max(r, Math.hypot(t._tx - f._x, t._ty - f._y) + t.offsetWidth / 2);
        const x = f._x + r + 130;
        let y = f._y;
        for (let i = 0; i < 40; i++) {
          if (!f._scenes.some((s) => Math.abs(s._y - y) < 100 && Math.abs(s._x - x) < 160)) break;
          y += 110;
        }
        return { x, y };
      }

      function createScene(f) {
        const p = sceneSpot(f);
        const s = makeScene(f, p.x, p.y);
        popIn(s);
        drawLines();
        startEditing(s, true);
        return s;
      }

      function renderScenePreview(s) {
        const cv = s._cv;
        if (cv.width !== s._w * 16) cv.width = s._w * 16;
        if (cv.height !== s._h * 16) cv.height = s._h * 16;
        cv.style.width = `${s._w * 8}px`;
        cv.style.height = `${s._h * 8}px`;
        const ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, cv.width, cv.height);
        const map = tagMap(), now = performance.now();
        for (let y = 0; y < s._h; y++) for (let x = 0; x < s._w; x++) {
          const id = s._cells[y][x];
          const t = id && map.get(id);
          if (t) ctx.drawImage(shownBmp(t, now), x * 16, y * 16);
        }
      }

      function renderScenes() {
        for (const s of scenesAll()) renderScenePreview(s);
        if (sceneEd) { renderMapTiles(); renderPieces(); }
      }

      // =====================================================================
      // Delete / hide
      // =====================================================================
      function removeItem(item) {
        if (brush && brush.tag === item) closeBrush();
        if (sceneEd && (sceneEd.scene === item || sceneEd.scene._folder === item)) closeScene();
        if (menu && menu.target === item) closeMenu(true);
        if (selected === item) {
          const parent = (isTag(item) || isScene(item)) && item._folder && item._folder.isConnected ? item._folder : null;
          select(parent);
        }
        if (editing && editing.item === item) editing = null;

        if (isFree(item)) {
          item.remove();
          scheduleSave();
          updatePin();
          return;
        }

        removeCommentBox(item);
        if (isTag(item)) {
          const f = item._folder;
          f._tags = f._tags.filter((t) => t !== item);
          if (item._line) item._line.remove();
          removeThumb(item);
          for (const s of scenesAll())
            for (const row of s._cells)
              for (let i = 0; i < row.length; i++) if (row[i] === item._id) row[i] = null;
          item.remove();
          if (f.isConnected) layoutFolder(f);
          renderScenes();
        } else if (isFolder(item)) {
          for (const s of [...item._scenes]) removeItem(s);
          for (const t of [...item._tags]) removeItem(t);
          item.remove();
        } else if (isScene(item)) {
          const f = item._folder;
          f._scenes = f._scenes.filter((s) => s !== item);
          item._line.remove();
          item.remove();
        }
        drawLines();
        updatePin();
      }

      function toggleHidden(item) {
        item._hidden = !item._hidden;
        syncHidden(item);
        scheduleSave();
      }

      // =====================================================================
      // Selection and editing
      // =====================================================================
      function select(item) {
        if (selected === item) return;
        if (selected) selected.classList.remove('selected');
        selected = item;
        if (item) item.classList.add('selected');
      }

      function startEditing(item, isNew = false) {
        if (isFree(item)) { startCommentEditing(item); return; }
        if (editing && editing.item === item && !editing.isComment) return;
        commitEditing();
        closeMenu();
        select(item);
        const el = labelOf(item);
        editing = { item, el, original: el.textContent, isNew };
        item.classList.add('editing');
        el.setAttribute('contenteditable', 'plaintext-only');
        if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
        el.setAttribute('spellcheck', 'false');
        el.focus({ preventScroll: true });
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function siblingsOf(item) {
        if (isFolder(item)) return [...folders()];
        if (isScene(item)) return item._folder._scenes;
        return item._folder ? item._folder._tags : [];
      }

      // names are what the engine calls, so they stay unique among siblings
      function uniqueName(item, name) {
        const taken = new Set(siblingsOf(item).filter((o) => o !== item).map((o) => nameOf(o).trim()));
        if (!taken.has(name)) return name;
        let n = 2;
        while (taken.has(`${name}${n}`)) n++;
        return `${name}${n}`;
      }

      function finishEditing(cancel) {
        if (!editing) return;
        if (editing.isComment) { finishCommentEditing(cancel); return; }
        const { item, el, original, isNew } = editing;
        editing = null;
        item.classList.remove('editing');
        el.removeAttribute('contenteditable');
        window.getSelection().removeAllRanges();

        let name = el.textContent.replace(/\s+/g, ' ');
        if (isFolder(item)) name = name.replace(/[[\]]/g, '');
        else if (isScene(item)) name = name.replace(/[{}]/g, '');
        else name = name.replace(/[:()<>]/g, '');
        name = name.trim();

        if (cancel || !name) {
          if (isNew) { removeItem(item); return; }
          el.textContent = original;
        } else {
          name = uniqueName(item, name);
          el.textContent = name;
          item.title = name;
        }
        afterResize(item);
      }

      const commitEditing = () => finishEditing(false);
      const cancelEditing = () => finishEditing(true);

      function afterResize(item) {
        if (isFolder(item)) { sizeFolder(item); layoutFolder(item); }
        else if (isTag(item) && item._folder) layoutFolder(item._folder);
        drawLines();
        updatePin();
      }

      // ---------- Off-camera pin ----------
      function updatePin() {
        const W = window.innerWidth, H = window.innerHeight;
        const cx = W / 2, cy = H / 2;
        let best = null, bestDist = Infinity;

        for (const el of items()) {
          const sx = el._x * cam.z + cam.x;
          const sy = el._y * cam.z + cam.y;
          const hw = (el.offsetWidth / 2) * cam.z, hh = (el.offsetHeight / 2) * cam.z;
          if (!(sx + hw < 0 || sx - hw > W || sy + hh < 0 || sy - hh > H)) continue;
          const d = Math.hypot(sx - cx, sy - cy);
          if (d < bestDist) { bestDist = d; best = { el, sx, sy }; }
        }

        pinTarget = best ? best.el : null;
        if (!best) { pin.classList.remove('visible'); return; }

        const dx = best.sx - cx, dy = best.sy - cy;
        const angle = Math.atan2(dy, dx);
        const t = Math.min(
          dx !== 0 ? (cx - PIN_MARGIN) / Math.abs(dx) : Infinity,
          dy !== 0 ? (cy - PIN_MARGIN) / Math.abs(dy) : Infinity
        );
        pin.style.left = `${cx + dx * t}px`;
        pin.style.top = `${cy + dy * t}px`;
        pin.style.setProperty('--angle', `${angle}rad`);
        pin.dataset.label = nameOf(best.el);

        const lx = Math.cos(angle) > 0.5 ? 'calc(-100% - 20px)' : Math.cos(angle) < -0.5 ? '20px' : '-50%';
        const ly = Math.sin(angle) > 0.5 ? 'calc(-100% - 20px)' : Math.sin(angle) < -0.5 ? '20px' : '-50%';
        pin.style.setProperty('--lx', lx);
        pin.style.setProperty('--ly', lx === '-50%' && ly === '-50%' ? '20px' : ly);
        pin.classList.add('visible');
      }

      pin.addEventListener('pointerdown', (e) => e.stopPropagation());
      pin.addEventListener('click', () => {
        if (!pinTarget) return;
        closeMenu();
        select(pinTarget);
        flyTo(pinTarget._x, pinTarget._y);
      });

      // =====================================================================
      // Radial menu
      // =====================================================================
      function menuFor(target) {
        if (!target) return MENU_EMPTY;
        const base = isFolder(target) ? MENU_FOLDER : isScene(target) ? MENU_SCENE : isFree(target) ? MENU_FREE : MENU_TAG;
        return base.map((a) => (a.id === 'hide' && target._hidden ? { ...a, icon: ICON.show } : a));
      }

      function colorMenu(f) {
        return COLORS.map((c) => ({ id: 'swatch', color: c, label: c, current: c === f._color }));
      }

      function openMenu(x, y, target = null, actions = null) {
        commitEditing();
        if (target && !target.isConnected) target = null;
        closeMenu(true);
        actions = actions || menuFor(target);

        menu = { x, y, target };
        let cx = x, cy = y;
        if (target) {
          select(target);
          target.classList.add('menu-target');
          const r = target.getBoundingClientRect();
          cx = r.left + r.width / 2;
          cy = r.top + r.height / 2;
        } else {
          select(null);
        }

        // always a circle, sized only by how many orbs it holds
        const n = actions.length;
        const rad = Math.max(FREE_RADIUS, (n * (ORB_SIZE + ORB_GAP)) / (Math.PI * 2));
        const start = n === 2 ? Math.PI : -Math.PI / 2;

        const pad = ORB_SIZE / 2 + 8;
        const ocx = clamp(cx, rad + pad, window.innerWidth - rad - pad);
        const ocy = clamp(cy, rad + pad, window.innerHeight - rad - pad);

        radial.style.left = `${ocx}px`;
        radial.style.top = `${ocy}px`;
        radial.innerHTML = target ? '' : '<div class="origin"></div>';
        if (!target) radial.firstChild.style.transform = `translate(${cx - ocx}px, ${cy - ocy}px)`;

        actions.forEach((action, i) => {
          const ang = start + (i / n) * Math.PI * 2;
          const tx = rad * Math.cos(ang);
          const ty = rad * Math.sin(ang);

          const orb = document.createElement('button');
          orb.type = 'button';
          orb.className = 'orb';
          orb.dataset.action = action.id;
          orb.setAttribute('aria-label', action.label);
          orb.style.setProperty('--tx', `${tx}px`);
          orb.style.setProperty('--ty', `${ty}px`);
          orb.style.setProperty('--delay', `${i * ORB_STAGGER}ms`);

          if (action.id === 'swatch') {
            orb.classList.add('swatch');
            if (action.current) orb.classList.add('current');
            orb.style.setProperty('--swatch', action.color);
          } else {
            orb.innerHTML = svg(action.icon);
          }

          orb.addEventListener('pointerdown', (e) => e.stopPropagation());
          orb.addEventListener('click', (e) => {
            e.stopPropagation();
            runAction(action);
          });
          radial.appendChild(orb);
        });

        void radial.offsetWidth;
        radial.classList.add('open');
        radial.setAttribute('aria-hidden', 'false');
      }

      function closeMenu(immediate = false) {
        if (menu && menu.target) menu.target.classList.remove('menu-target');
        menu = null;
        radial.classList.remove('open');
        radial.setAttribute('aria-hidden', 'true');
        if (immediate) radial.innerHTML = '';
      }

      function runAction(action) {
        if (!menu) return;
        const { x, y, target } = menu;
        closeMenu(true);

        if (!target) {
          const p = toWorld(x, y);
          if (action.id === 'folder') createFolder(p.x, p.y);
          else if (action.id === 'note') { const n = makeFree(p.x, p.y); popIn(n); startCommentEditing(n); }
          else if (action.id === 'save') download();
          else if (action.id === 'load') fileIn.click();
          return;
        }

        if (action.id === 'hide') { toggleHidden(target); return; }
        if (action.id === 'comment') { startCommentEditing(target); return; }
        if (action.id === 'delete') { removeItem(target); return; }

        if (isFolder(target)) {
          switch (action.id) {
            case 'create': createTag(target, false); break;
            case 'loop':   createTag(target, true); break;
            case 'scene':  createScene(target); break;
            case 'color':  openMenu(x, y, target, colorMenu(target)); break;
            case 'swatch': setFolderColor(target, action.color); break;
          }
          return;
        }

        if (isScene(target)) {
          if (action.id === 'open') openScene(target);
          return;
        }

        if (isTag(target)) {
          switch (action.id) {
            case 'create': createTag(target._folder, false); break;
            case 'loop':   createTag(target._folder, true); break;
            case 'brush':  openBrush(target); break;
          }
        }
      }

      // =====================================================================
      // Load
      // =====================================================================
      function clearAll() {
        closeBrush();
        closeScene();
        closeMenu(true);
        editing = null;
        selected = null;
        drag = null;
        dropTarget = null;
        for (const el of [...world.children]) if (el !== links) el.remove();
        links.innerHTML = '';
      }

      function buildItem(it, folder, id) {
        const tag = makeTag(folder, it.loop, id);
        tag.textContent = it.name;
        tag.title = it.name;
        const dec = decodeFrames(it.loop ? it.seeds : it.seeds.slice(0, 1));
        tag._frames = dec.frames;
        tag._pal = dec.pal;
        tag._fps = it.loop ? it.fps : 0;
        tag._hidden = !!it.hidden;
        if (it.comment) setComment(tag, it.comment);
        return tag;
      }

      function load(text) {
        const data = parse(text);
        if (!data) return false;
        clearAll();

        const used = new Set();
        const remap = new Map();
        const uid = (id) => {
          if (id && MAC_RE.test(id) && !used.has(id)) { used.add(id); return id; }
          const g = newId(used);
          if (id && !remap.has(id)) remap.set(id, g);
          return g;
        };

        data.clusters.forEach((c, ci) => {
          const f = makeFolder(c.x ?? ci * 360, c.y ?? 0);
          f._label.textContent = c.name || 'cluster';
          f.title = f._label.textContent;
          if (c.color) setFolderColor(f, c.color);
          sizeFolder(f);
          f._id = uid(c.id);
          f._hidden = c.hidden;
          for (const it of c.items) buildItem(it, f, uid(it.id));
          if (c.comment) setComment(f, c.comment);
          c.scenes.forEach((sd, si) => {
            const s = makeScene(f, sd.x ?? f._x + 320, sd.y ?? f._y + si * 110);
            s._id = uid(sd.id);
            s._label.textContent = sd.name;
            s.title = sd.name;
            s._w = sd.w;
            s._h = sd.h;
            for (let y = 0; y < MAX_H; y++)
              for (let x = 0; x < MAX_W; x++) { const v = (sd.rows[y] && sd.rows[y][x]) || null; s._cells[y][x] = v && remap.has(v) ? remap.get(v) : v; }
            s._hidden = sd.hidden;
            if (sd.comment) setComment(s, sd.comment);
          });
        });
        data.notes.forEach((nd, i) => {
          const n = makeFree(nd.x ?? 0, nd.y ?? 200 + i * 50, nd.text);
          n._hidden = nd.hidden;
          syncHidden(n);
        });

        for (const t of tagsAll()) refreshTag(t);
        for (const f of folders()) { syncHidden(f); sizeFolder(f); layoutFolder(f); }
        for (const t of tagsAll()) { t._x = t._tx; t._y = t._ty; applyPos(t); }
        for (const s of scenesAll()) { syncHidden(s); renderScenePreview(s); }
        drawLines();
        centerOnContent();
        return true;
      }

      function centerOnContent() {
        const all = [...items()];
        cam.z = 1;
        if (all.length) {
          const xs = all.map((e) => e._x), ys = all.map((e) => e._y);
          cam.x = window.innerWidth / 2 - (Math.min(...xs) + Math.max(...xs)) / 2;
          cam.y = window.innerHeight / 2 - (Math.min(...ys) + Math.max(...ys)) / 2;
        } else {
          cam.x = window.innerWidth / 2;
          cam.y = window.innerHeight / 2;
        }
        applyCamera();
      }

      // =====================================================================
      // Events
      // =====================================================================
      window.addEventListener('contextmenu', (e) => {
        if (editing && editing.el.contains(e.target)) return;
        e.preventDefault();
        if (brush || sceneEd) return;
        if (bar) closeBar();
        if (e.target.closest('.orb') || e.target.closest('#pin') || e.target.closest('#kbar')) return;
        const note = e.target.closest('.comment-box');
        const target = note ? (note._owner || note) : e.target.closest(ITEM_SEL);
        openMenu(e.clientX, e.clientY, target);
      });

      canvas.addEventListener('dblclick', (e) => {
        if (e.target.closest('.scene-preview')) return;
        const note = e.target.closest('.comment-box');
        if (note && !isFree(note)) return;
        const item = e.target.closest(ITEM_SEL);
        if (item) startEditing(item);
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        const item = e.button === 0 ? e.target.closest(ITEM_SEL) : null;

        if (menu) closeMenu();
        if (bar) closeBar();

        if (!item) {
          commitEditing();
          select(null);
          stopCamAnim();
          pan = { pointerId: e.pointerId, lastX: e.clientX, lastY: e.clientY };
          canvas.classList.add('panning');
          canvas.setPointerCapture(e.pointerId);
          e.preventDefault();
          return;
        }

        if (editing && (editing.el === item || (editing.item === item && !editing.isComment))) return;
        commitEditing();
        select(item);

        drag = {
          item,
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          originX: item._x,
          originY: item._y,
          moved: false,
          onPreview: !!e.target.closest('.scene-preview')
        };
        item.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (pan && e.pointerId === pan.pointerId) {
          moveCamera(e.clientX - pan.lastX, e.clientY - pan.lastY);
          pan.lastX = e.clientX;
          pan.lastY = e.clientY;
          return;
        }
        if (!drag || e.pointerId !== drag.pointerId) return;

        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        if (!drag.moved) {
          if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
          drag.moved = true;
          drag.item.classList.add('dragging');
        }

        const nx = drag.originX + dx / cam.z;
        const ny = drag.originY + dy / cam.z;
        const item = drag.item;

        if (isFolder(item)) {
          const mx = nx - item._x, my = ny - item._y;
          setPos(item, nx, ny);
          for (const t of item._tags) {
            t._x += mx; t._tx += mx;
            t._y += my; t._ty += my;
            applyPos(t);
          }
          for (const s of item._scenes) setPos(s, s._x + mx, s._y + my);
        } else if (isTag(item)) {
          setPos(item, nx, ny);
          const p = toWorld(e.clientX, e.clientY);
          const f = folderAt(p.x, p.y);
          setDropTarget(f && f !== item._folder ? f : null);
        } else {
          setPos(item, nx, ny);
        }
        drawLines();
        updatePin();
      });

      function endPointer(e) {
        if (pan && e.pointerId === pan.pointerId) {
          pan = null;
          canvas.classList.remove('panning');
        }
        if (!drag || e.pointerId !== drag.pointerId) return;

        const { item, moved, onPreview } = drag;
        item.classList.remove('dragging');
        drag = null;

        if (!moved && isScene(item) && onPreview) { openScene(item); return; }

        if (moved && isTag(item)) {
          const f = dropTarget;
          setDropTarget(null);
          // a string or loop always lives in a cluster: move to another or snap back
          if (f) {
            attach(item, f);
            const name = uniqueName(item, nameOf(item).trim());
            if (name !== nameOf(item)) { item.textContent = name; item.title = name; }
          } else layoutFolder(item._folder);
          drawLines();
        }
      }
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);

      window.addEventListener('wheel', (e) => {
        if (brushPanel.contains(e.target) || scenePanel.contains(e.target)) return;
        e.preventDefault();
        if (brush || sceneEd) return;
        if (menu) closeMenu(true);
        const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
        const speed = e.ctrlKey ? 0.01 : 0.0015;
        const delta = clamp(e.deltaY * k, -200, 200);
        zoomAt(e.clientX, e.clientY, Math.exp(-delta * speed));
      }, { passive: false });

      canvas.addEventListener('focusout', (e) => {
        if (editing && !editing.isComment && e.target === editing.el) commitEditing();
      });

      canvas.addEventListener('paste', (e) => {
        if (!editing) return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain');
        if (!editing.isComment) text = text.replace(/\s+/g, ' ');
        document.execCommand('insertText', false, text);
      });

      canvas.addEventListener('input', () => {
        if (!editing) return;
        if (editing.isComment) { if (isFree(editing.item)) scheduleSave(); else relayoutAround(editing.item); }
        else afterResize(editing.item);
      });

      // save / open work everywhere
      window.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey)) return;
        const k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); e.stopPropagation(); download(); }
        else if (k === 'o') { e.preventDefault(); e.stopPropagation(); fileIn.click(); }
      }, true);

      // ---------- Keyboard: move, create, act ----------
      const kbar = $('kbar');
      let bar = null; // { actions, i, target }
      const posOf = (el) => ({ x: el._tx ?? el._x, y: el._ty ?? el._y });
      const centerWorld = () => toWorld(window.innerWidth / 2, window.innerHeight / 2);

      function focusSelected() {
        requestAnimationFrame(() => {
          if (!selected || !selected.isConnected) return;
          const p = posOf(selected);
          flyTo(p.x, p.y);
        });
      }

      function focusOn(el) {
        select(el);
        focusSelected();
      }

      function navigate(k) {
        const all = [...items()];
        if (!all.length) return;
        const cur = selected && selected.isConnected ? selected : null;
        if (!cur) {
          const c = centerWorld();
          let best = null, bd = Infinity;
          for (const el of all) {
            const p = posOf(el), d = Math.hypot(p.x - c.x, p.y - c.y);
            if (d < bd) { bd = d; best = el; }
          }
          focusOn(best);
          return;
        }
        const [ux, uy] = DIRS[k];
        const p = posOf(cur);
        let best = null, bs = Infinity;
        for (const el of all) {
          if (el === cur) continue;
          const q = posOf(el);
          const dx = q.x - p.x, dy = q.y - p.y;
          const along = dx * ux + dy * uy;
          if (along <= 4) continue;
          const across = Math.abs(dx * uy - dy * ux);
          if (across > along * 2.2) continue;
          const sc = along + across * 2;
          if (sc < bs) { bs = sc; best = el; }
        }
        focusOn(best || cur);
      }

      function goUp() {
        if (!selected) return;
        if ((isTag(selected) || isScene(selected)) && selected._folder) focusOn(selected._folder);
        else select(null);
      }

      function clusterSpot(fol) {
        if (!fol) return centerWorld();
        // to the right of everything this cluster owns: ring and scenes
        let right = fol._x + fol._hw;
        for (const t of fol._tags) right = Math.max(right, posOf(t).x + t.offsetWidth / 2);
        for (const sc of fol._scenes) right = Math.max(right, sc._x + sc.offsetWidth / 2);
        const x = right + 260;
        let y = fol._y;
        for (let i = 0; i < 40; i++) {
          if (![...items()].some((o) => o !== fol && Math.abs(posOf(o).x - x) < 220 && Math.abs(posOf(o).y - y) < 160)) break;
          y += 220;
        }
        return { x, y };
      }

      const DELIMS = new Set(['(', '<', '{', '[', '/']);

      function keyCreate(k) {
        const sel = selected && selected.isConnected ? selected : null;
        const fol = sel ? (isFolder(sel) ? sel : sel._folder || null) : null;
        if (k === '(' && fol) createTag(fol, false);
        else if (k === '<' && fol) createTag(fol, true);
        else if (k === '{' && fol) createScene(fol);
        else if (k === '[') { const p = clusterSpot(fol); createFolder(p.x, p.y); }
        else if (k === '/') {
          if (sel) startCommentEditing(sel);
          else { const c = centerWorld(); const n = makeFree(c.x, c.y); popIn(n); startCommentEditing(n); }
        } else return;
        if (editing) editing.kb = true;
        focusSelected();
      }

      function openSelected() {
        if (!selected) return;
        if (isTag(selected)) openBrush(selected, true);
        else if (isScene(selected)) openScene(selected, true);
        else if (isFree(selected)) { startCommentEditing(selected); editing.kb = true; }
      }

      function openBar(actions = null) {
        closeMenu(true);
        const target = selected && selected.isConnected ? selected : null;
        actions = actions || menuFor(target);
        bar = { actions, i: 0, target };
        kbar.innerHTML = '';
        actions.forEach((a, idx) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'kbtn';
          b.dataset.action = a.id;
          b.setAttribute('aria-label', a.label);
          if (a.id === 'swatch') {
            b.classList.add('swatch');
            b.style.setProperty('--swatch', a.color);
            if (a.current) bar.i = idx;
          } else b.innerHTML = svg(a.icon);
          b.addEventListener('pointerdown', (e) => e.stopPropagation());
          b.addEventListener('click', () => { if (!bar) return; bar.i = idx; runBar(); });
          kbar.appendChild(b);
        });
        syncBar();
        kbar.classList.add('open');
        kbar.setAttribute('aria-hidden', 'false');
      }

      function closeBar() {
        bar = null;
        kbar.classList.remove('open');
        kbar.setAttribute('aria-hidden', 'true');
      }

      function syncBar() {
        [...kbar.children].forEach((b, i) => b.classList.toggle('focus', i === bar.i));
      }

      function runBar() {
        const a = bar.actions[bar.i];
        const target = bar.target;
        closeBar();
        if (a.id === 'color') { openBar(colorMenu(target)); return; }
        if (a.id === 'swatch') { setFolderColor(target, a.color); return; }
        if (a.id === 'brush') { openBrush(target, true); return; }
        if (a.id === 'open') { openScene(target, true); return; }
        menu = { x: window.innerWidth / 2, y: window.innerHeight / 2, target };
        runAction(a);
        if (editing) editing.kb = true;
        focusSelected();
      }

      function barKeys(e) {
        const k = e.key, n = bar.actions.length;
        if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); bar.i = (bar.i + 1) % n; syncBar(); }
        else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); bar.i = (bar.i - 1 + n) % n; syncBar(); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); runBar(); }
        else if (k === 'Escape' || k === 'Tab') { e.preventDefault(); closeBar(); }
      }

      window.addEventListener('keydown', (e) => {
        if (bar) { barKeys(e); return; }
        if (brush) { brushKeys(e); return; }
        if (sceneEd) { sceneKeys(e); return; }
        if (editing) {
          if (editing.isComment) {
            if (e.key === 'Escape') { e.preventDefault(); finishCommentEditing(true); }
            return;
          }
          if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            const kb = editing.kb;
            commitEditing();
            if (kb) focusSelected();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            const kb = editing.kb;
            cancelEditing();
            if (kb) focusSelected();
          }
          return;
        }
        if (e.metaKey) return;
        const k = e.key;

        // the signs come from any layout, with or without Shift / AltGr / Option
        if (DELIMS.has(k)) { e.preventDefault(); if (menu) closeMenu(true); keyCreate(k); return; }
        if (e.ctrlKey || e.altKey) return;

        if (k === 'Tab') { e.preventDefault(); openBar(); return; }
        if (DIRS[k]) {
          e.preventDefault();
          if (menu) closeMenu(true);
          if (e.shiftKey) moveCamera(-DIRS[k][0] * 90, -DIRS[k][1] * 90);
          else navigate(k);
          return;
        }
        if (k === '+' || k === '=') { zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.2); return; }
        if (k === '-' || k === '_') { zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.2); return; }
        if (k === 'Escape') { if (menu) closeMenu(); else goUp(); return; }
        if (k === ' ') { e.preventDefault(); openSelected(); return; }
        if (!selected) return;
        if (k === 'Enter') { e.preventDefault(); startEditing(selected); editing && (editing.kb = true); return; }
        if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removeItem(selected); focusSelected(); return; }
        if (k.toLowerCase() === 'h') { toggleHidden(selected); }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key !== ' ') return;
        if (brush && brush.spaceDown) { brush.spaceDown = false; syncTagVisual(brush.tag); }
        if (sceneEd && sceneEd.spaceDown) { sceneEd.spaceDown = false; drawLines(); }
      });

      fileIn.addEventListener('change', () => {
        openFile(fileIn.files[0]);
        fileIn.value = '';
      });
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        openFile(e.dataTransfer && e.dataTransfer.files[0]);
      });

      window.addEventListener('resize', () => {
        closeMenu(true);
        updatePin();
      });
      window.addEventListener('pagehide', () => { commitEditing(); saveNow(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

      // ---------- Start ----------
      let stored = null;
      try { stored = localStorage.getItem(STORE_KEY); } catch (_) {}
      if (!(stored && load(stored))) centerOnContent();

      window.microbuild = { serialize, load };
    })();
  </script>
</body>
</html>
